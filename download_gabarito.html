<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download // Diagrama_Cyber-Editorial</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body {
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #191919;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(255, 184, 0, 0.15);
      color: #FFB800;
      border: 1px solid #FFB800;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 4px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    h1 { 
      font-size: 20px; 
      font-weight: 800; 
      margin-bottom: 12px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    p { 
      color: #999; 
      font-size: 14px; 
      line-height: 1.6; 
      margin-bottom: 26px; 
    }
    .btn-salvar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: #FFB800;
      color: #0d0d0d;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(255, 184, 0, 0.25);
      cursor: pointer;
    }
    .btn-salvar:hover { 
      background: #FFC82C; 
      box-shadow: 0 0 25px rgba(255, 184, 0, 0.5); 
      transform: translateY(-2px);
    }
    .btn-salvar:active {
      transform: scale(0.98);
      background: #00E575;
      color: #052613;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">FLUXO DAIA // ATIVO DE DIREÇÃO</div>
    <h1>Diagrama_Cyber-Editorial</h1>
    <p>O download do arquivo de coordenadas deve iniciar automaticamente em instantes.</p>
    
    <!-- LINK MANUAL CASO O NAVEGADOR BLOQUEIE A AUTOMAÇÃO -->
    <a 
      href="https://rilkidesign.github.io/widgets-notion/Diagrama_Cyber-Editorial.png" 
      download="Diagrama_Cyber-Editorial.png" 
      class="btn-salvar" 
      id="manualBtn"
    >
      ⚡ BAIXAR MANUALMENTE (.PNG)
    </a>
  </div>

  <script>
    // DISPARO AUTOMÁTICO VIA MEMÓRIA (BLOB) - À PROVA DE FALHAS
    async function baixarAutomatico() {
      const urlImagem = "https://rilkidesign.github.io/widgets-notion/Diagrama_Cyber-Editorial.png";
      const nomeArquivo = "Diagrama_Cyber-Editorial.png";

      try {
        const resposta = await fetch(urlImagem);
        const blob = await resposta.blob();
        const urlBlob = window.URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = urlBlob;
        link.download = nomeArquivo;
        document.body.appendChild(link);
        link.click();
        
        // Limpa a memória RAM do navegador após o disparo
        setTimeout(() => {
          document.body.removeChild(link);
          window.URL.revokeObjectURL(urlBlob);
        }, 1000);

      } catch (erro) {
        // Se der qualquer bloqueio de segurança silencioso, aciona o botão manual normal
        console.warn("Automação bloqueada pelo navegador. Usando rota física:", erro);
        const fallback = document.createElement('a');
        fallback.href = urlImagem;
        fallback.download = nomeArquivo;
        document.body.appendChild(fallback);
        fallback.click();
        document.body.removeChild(fallback);
      }
    }

    // Espera 400ms para a tela carregar visualmente e puxa o gatilho
    window.addEventListener('load', () => {
      setTimeout(baixarAutomatico, 400);
    });
  </script>

</body>
</html>
