<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* CAMUFLAGEM COM NOTION DARK + RESPIRO PRO GLOW */
    html, body {
      background-color: #191919 !important;
      color-scheme: dark;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 20px;
      min-height: 90px;
      overflow: hidden;
    }

    /* ANIMAÇÃO 1: LEVITAÇÃO / RESPIRAÇÃO SUAVE (ESTILO ITEM LENDÁRIO) */
    @keyframes flutuar {
      0%, 100% {
        transform: translateY(0px);
        box-shadow: 0 4px 14px rgba(255, 184, 0, 0.25), 0 0 15px rgba(255, 184, 0, 0.15);
      }
      50% {
        transform: translateY(-4px);
        box-shadow: 0 8px 22px rgba(255, 184, 0, 0.4), 0 0 25px rgba(255, 184, 0, 0.3);
      }
    }

    /* ANIMAÇÃO 2: FEIXE DE LUZ LÍQUIDA (SHIMMER REFLEXO METÁLICO) */
    @keyframes reflexoLuz {
      0% {
        left: -120%;
      }
      25% {
        left: 140%;
      }
      100% {
        left: 140%;
      }
    }

    /* ANIMAÇÃO 3: PULSO ELÉTRICO NO ÍCONE */
    @keyframes choqueIcone {
      0%, 80%, 100% {
        transform: scale(1) rotate(0deg);
      }
      85% {
        transform: scale(1.3) rotate(-8deg);
      }
      90% {
        transform: scale(1.1) rotate(5deg);
      }
      95% {
        transform: scale(1.25) rotate(-3deg);
      }
    }

    /* ESTRUTURA PRINCIPAL DO BOTÃO */
    .btn-fundador {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 620px;
      padding: 16px 24px;
      font-size: clamp(13px, 3vw, 15px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #0d0d0d;
      background: #FFB800;
      border: 1px solid #FFC933;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden; /* OBRIGATÓRIO: Mantém o reflexo de luz preso dentro dos cantos arredondados */
      animation: flutuar 3.5s ease-in-out infinite;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* O FEIXE DE LUZ QUE CORTA O BOTÃO */
    .btn-fundador::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -120%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: reflexoLuz 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      pointer-events: none;
    }

    .btn-icon {
      font-size: 16px;
      display: inline-block;
      animation: choqueIcone 3.5s ease-in-out infinite;
    }

    /* QUANDO PASSA O MOUSE: PARA DE FLUTUAR E CARREGA O DISPARO */
    .btn-fundador:hover {
      background: #FFC82C;
      animation-play-state: paused; /* Trava a flutuação na posição de combate */
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 0 25px rgba(255, 200, 44, 0.75), 0 0 45px rgba(255, 184, 0, 0.35);
      border-color: #FFE680;
    }

    .btn-fundador:hover .btn-icon {
      animation: none;
      transform: scale(1.25) rotate(-8deg);
    }

    /* FEEDBACK DE TIRO / CLIQUE VERDE TÁTICO */
    .btn-fundador:active,
    .btn-fundador.clicado {
      background: #00E575 !important;
      border-color: #5CFFAB !important;
      color: #052613 !important;
      box-shadow: 0 0 30px rgba(0, 229, 117, 0.9), 0 0 60px rgba(0, 229, 117, 0.4) !important;
      transform: scale(0.97) !important;
      animation: none !important;
    }

    .btn-fundador.clicado::after {
      display: none; /* Desliga o reflexo após o clique */
    }
  </style>
</head>
<body>

  <!-- LINK DE EMBARQUE DIRETO -->
  <a 
    href="https://forms.gle/6FgjFP5EZ5yaGy4K7" 
    target="_blank" 
    class="btn-fundador" 
    id="ctaBtn"
    onclick="dispararClique()"
  >
    <span class="btn-icon">⚡</span>
    <span id="btnText">QUERO MINHA VAGA DE FUNDADOR</span>
  </a>

  <script>
    function dispararClique() {
      const btn = document.getElementById('ctaBtn');
      const text = document.getElementById('btnText');
      
      // Vira verde neon na hora do clique
      btn.classList.add('clicado');
      text.innerText = "ACESSO AUTORIZADO // ABRINDO...";
      
      // Reseta caso o usuário volte na aba
      setTimeout(() => {
        btn.classList.remove('clicado');
        text.innerText = "QUERO MINHA VAGA DE FUNDADOR";
      }, 2500);
    }
  </script>

</body>
</html>
