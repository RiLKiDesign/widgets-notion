<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* CAMUFLAGEM COM NOTION DARK */
    html, body {
      background-color: #191919 !important;
      color-scheme: dark;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 12px 18px;
      min-height: 72px;
      overflow: hidden;
    }

    /* BOTÃO SLIM IDÊNTICO AO PASSO 1 */
    .btn-diagrama {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 26px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #0d0d0d;
      background: #FFB800;
      border: 1px solid #FFC933;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(255, 184, 0, 0.25);
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
      stroke: #0d0d0d;
      stroke-width: 2.5;
      fill: none;
      display: block;
      transition: transform 0.2s ease;
    }

    /* HOVER NEON */
    .btn-diagrama:hover {
      background: #FFC82C;
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 200, 44, 0.7), 0 0 35px rgba(255, 184, 0, 0.25);
      border-color: #FFE680;
    }

    .btn-diagrama:hover .btn-icon svg {
      transform: translateY(2px);
    }

    /* CLIQUE VERDE TÁTICO */
    .btn-diagrama:active,
    .btn-diagrama.clicado {
      background: #00E575 !important;
      border-color: #5CFFAB !important;
      color: #052613 !important;
      box-shadow: 0 0 25px rgba(0, 229, 117, 0.85) !important;
      transform: scale(0.98);
    }

    .btn-diagrama.clicado .btn-icon svg {
      stroke: #052613 !important;
    }
  </style>
</head>
<body>

  <!-- ABRE O DISPARADOR FORA DA PRISÃO DO NOTION -->
  <a 
    href="https://rilkidesign.github.io/widgets-notion/download_diagrama.html" 
    target="_blank" 
    class="btn-diagrama" 
    id="btn"
    onclick="disparar()"
  >
    <span class="btn-icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </span>
    <span id="txt">BAIXAR DIAGRAMA CYBER-EDIT.</span>
  </a>

  <script>
    function disparar() {
      const btn = document.getElementById('btn');
      const txt = document.getElementById('txt');
      btn.classList.add('clicado');
      txt.innerText = "INICIANDO DISPARO...";
      setTimeout(() => {
        btn.classList.remove('clicado');
        txt.innerText = "BAIXAR DIAGRAMA CYBER-EDITORIAL";
      }, 2500);
    }
  </script>

</body>
</html>
