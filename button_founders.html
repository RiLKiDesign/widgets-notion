<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* CAMUFLAGEM + ÁREA DE RESPIRO PRO NEON DISSOLVER */
    html, body {
      background-color: #191919 !important;
      color-scheme: dark;
      display: flex;
      justify-content: center;
      align-items: center;
      /* O segredo: 20px em cima/baixo e 45px nas laterais para o glow morrer no escuro */
      padding: 20px 45px;
      min-height: 100px;
      overflow: hidden;
    }

    /* O BOTÃO TÁTICO */
    .btn-fundador {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      /* Deixa o botão respirar sem colar na borda do iframe */
      width: auto;
      max-width: 100%;
      padding: 16px 36px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #0d0d0d;
      background: #FFB800;
      border: 1px solid #FFC933;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(255, 184, 0, 0.25);
    }

    /* EFEITO 1: PASSOU O MOUSE (NEON RADIAL SUAVE) */
    .btn-fundador:hover {
      background: #FFC82C;
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 200, 44, 0.65), 0 0 40px rgba(255, 184, 0, 0.2);
      border-color: #FFE680;
    }

    /* EFEITO 2: APERTOU (CLIQUE VERDE TÁTICO) */
    .btn-fundador:active,
    .btn-fundador.clicado {
      background: #00E575 !important;
      border-color: #5CFFAB !important;
      color: #052613 !important;
      box-shadow: 0 0 25px rgba(0, 229, 117, 0.8), 0 0 50px rgba(0, 229, 117, 0.3) !important;
      transform: scale(0.98);
    }

    .btn-icon {
      font-size: 16px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .btn-fundador:hover .btn-icon {
      transform: scale(1.2) rotate(-5deg);
    }
  </style>
</head>
<body>

  <!-- COLOQUE O LINK DO SEU GOOGLE FORMS NO 'href' ABAIXO -->
  <a 
    href="https://forms.gle/6FgjFP5EZ5yaGy4K7" 
    target="_blank" 
    class="btn-fundador" 
    id="ctaBtn"
    onclick="dispararClique()"
  >
    <span class="btn-icon">⚡</span>
    <span id="btnText">ENTRAR PARA A LISTA VIP // VAGAS DE FUNDADOR</span>
  </a>

  <script>
    function dispararClique() {
      const btn = document.getElementById('ctaBtn');
      const text = document.getElementById('btnText');
      
      // Vira verde neon no clique
      btn.classList.add('clicado');
      text.innerText = "ACESSO AUTORIZADO // ABRINDO...";
      
      // Reseta depois de 2.5s se a pessoa voltar na aba
      setTimeout(() => {
        btn.classList.remove('clicado');
        text.innerText = "ENTRAR PARA A LISTA VIP // VAGAS DE FUNDADOR";
      }, 2500);
    }
  </script>

</body>
</html>
