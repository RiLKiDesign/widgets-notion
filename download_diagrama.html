<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baixando Diagrama...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0d0d0d;
      color: #FFB800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .status-box {
      background: #191919;
      border: 1px solid #333;
      padding: 30px;
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    h2 { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; color: #fff; }
    p { font-size: 13px; color: #888; margin-bottom: 20px; }
    .btn-fallback {
      display: inline-block;
      background: #FFB800;
      color: #000;
      padding: 12px 20px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 6px;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="status-box">
    <h2 id="msg">⚡ DISPARANDO ARQUIVO...</h2>
    <p id="sub">O download iniciou na sua máquina.</p>
    <a href="Diagrama_Cyber-Editorial.png" download="Diagrama_Cyber-Editorial.png" class="btn-fallback" id="gatilhoManual">
      CLIQUE SE NÃO BAIXOU SOZINHO
    </a>
  </div>

  <script>
    // Puxa o download imediatamente porque agora está fora do Notion
    window.onload = () => {
      const link = document.getElementById('gatilhoManual');
      link.click();
      
      document.getElementById('msg').innerText = "✔ DOWNLOAD INICIADO!";
      document.getElementById('msg').style.color = "#00E575";
      document.getElementById('sub').innerText = "Você já pode fechar esta aba.";

      // Tenta fechar a aba sozinho após 1.8 segundos
      setTimeout(() => {
        window.close();
      }, 1800);
    };
  </script>

</body>
</html>
